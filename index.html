    <!-- Google Fonts -->

    <!-- Service Worker Registration for PWABuilder & PWA compliance -->
    <script>
      // Clean up legacy caches immediately to prevent version mismatches
      if ('caches' in window) {
        caches.keys().then(function (names) {
          names.forEach(function (name) {
            if (name !== 'collabix-pwa-v5') {
              caches.delete(name);
            }
          });
        });
      }

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js', { scope: '/' })
            .then(function (registration) {
              registration.update();
              console.log('Collabix Service Worker muvaffaqiyatli ro‘yxatdan o‘tkazildi, scope:', registration.scope);
            })
            .catch(function (error) {
              console.warn('Collabix Service Worker ro‘yxatdan o‘tkazishda xatolik:', error);
            });
        });
      }
    </script>
  </head>
  <body class="bg-[#F8FAFD] text-[#0F172A] antialiased selection:bg-[#4F46E5] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
